---
tags:
- m.custom-image
- m.startup-script
- slurm6
- m.filestore
- m.schedmd-slurm-gcp-v6-controller
- m.schedmd-slurm-gcp-v6-login
- m.schedmd-slurm-gcp-v6-nodeset
- m.schedmd-slurm-gcp-v6-partition
- m.vpc
- m.cloud-storage-bucket
- m.multivpc
- m.private-service-access
- kueue-queued

substitutions:
  _TEST_PREFIX: "" # Default to no prefix

timeout: 14400s  # 4hr
steps:
# 1. Build and push workspace container containing the current code layer
- id: build-workspace-image
  name: gcr.io/cloud-builders/docker
  entrypoint: /bin/bash
  args:
  - -c
  - |
    docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID -f- . <<INNER_EOF
    FROM us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:latest
    COPY . /workspace
    WORKDIR /workspace
    INNER_EOF
    docker push us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID

# 2. Generate Job Manifest with Token Requests
- id: generate-job-manifest
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  secretEnv: ['GCLUSTER_GCS_PATH']
  args:
  - -c
  - |
    BUILD_ID_SHORT=$$(echo "$BUILD_ID" | cut -c1-6)
    cat <<INNER_EOF > job.yaml
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ml-a3-megagpu-onspot-$$BUILD_ID_SHORT
      namespace: default
      labels:
        kueue.x-k8s.io/queue-name: local-queue-test-locks
        build-id: "$BUILD_ID"
    spec:
      suspend: true
      template:
        spec:
          serviceAccountName: hpc-test-runner-ksa
          restartPolicy: Never
          containers:
          - name: runner
            image: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID
            env:
            - name: ANSIBLE_HOST_KEY_CHECKING
              value: "false"
            - name: ANSIBLE_CONFIG
              value: "/workspace/tools/cloud-build/ansible.cfg"
            - name: MACHINE_TYPE
              value: "a3-megagpu-8g"
            - name: NUM_NODES
              value: "4"
            - name: INSTANCE_PREFIX
              value: "a3msp"
            - name: PROJECT_ID
              value: "$PROJECT_ID"
            - name: BUILD_ID
              value: "$BUILD_ID"
            - name: OPTIONS_GCS_PATH
              value: "gs://hpc-ctk1357/a3moptions.txt"
            - name: ENABLE_SPOT_FALLBACK
              value: "true"
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -e -u -o pipefail
              echo "Sourcing find_available_zone.sh to determine zone."
              source /workspace/tools/cloud-build/find_available_zone.sh
              if [ -z "\$${ZONE:-}" ]; then
                echo "ERROR: ZONE not found" >&2
                exit 1
              fi
              set -x
              cd /workspace
              if [ "${_TEST_PREFIX}" == "daily-" ]; then
                  gsutil cp gs://$$GCLUSTER_GCS_PATH/latest/gcluster-bundle.zip .
                  unzip -o gcluster-bundle.zip
                  # Grant execution permissions to the binary
                  chmod +x gcluster
              else
                  make
              fi
              REGION="\$${ZONE%-*}"
              BUILD_ID_SHORT="\$${BUILD_ID:0:6}"
              BLUEPRINT="/workspace/examples/machine-learning/a3-megagpu-8g/a3mega-slurm-blueprint.yaml"
              sed -i -e '/deletion_protection:/{n;s/enabled: true/enabled: false/}' \$$BLUEPRINT
              sed -i -e '/reason:/d' \$$BLUEPRINT

              ENABLE_SPOT="true"
              SLURM_VARS_FILE="tools/cloud-build/daily-tests/tests/ml-a3-megagpu-onspot-slurm-ubuntu.yml"
              if [[ "\$$PROVISIONING_MODEL" == "STANDARD" ]]; then
                ENABLE_SPOT="false"
                sed -i '/instance_labels:/,+1d' "\$$SLURM_VARS_FILE"
                sed -i '/enable_spot: true/d' "\$$SLURM_VARS_FILE"
              else
                echo "INFO: Using \$$SLURM_VARS_FILE as it is for SPOT provisioning."
              fi

              bash tools/add_ttl_label.sh \$$BLUEPRINT
              python3 tools/fix_vpc_name.py \$$BLUEPRINT "${_TEST_PREFIX}"

              ansible-playbook tools/cloud-build/daily-tests/ansible_playbooks/slurm-integration-test.yml \
                --extra-vars="test_prefix=${_TEST_PREFIX} use_fixed_vpc=true" \
                --user=sa_117072932881248643794 \
                --extra-vars="project=$PROJECT_ID build=\$$BUILD_ID_SHORT" \
                --extra-vars="region=\$$REGION zone=\$$ZONE" \
                --extra-vars="enable_spot=\$$ENABLE_SPOT" \
                --extra-vars="@\$$SLURM_VARS_FILE"
            resources:
              requests:
                test-locks/slurm-generic: 1
                test-locks/a3-megagpu: 1
                test-locks/vpc-heavy: 1
                test-locks/filestore-high-scale: 1
              limits:
                test-locks/slurm-generic: 1
                test-locks/a3-megagpu: 1
                test-locks/vpc-heavy: 1
                test-locks/filestore-high-scale: 1
    INNER_EOF

# 3. Submit GKE Kueue Job
- id: submit-gke-job
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - -c
  - |
    gcloud container clusters get-credentials poc-test-infra-cluster-standard --region=us-central1
    kubectl apply -f /workspace/job.yaml

# 4. Stream Logs and Monitor GKE Job execution
- id: monitor-gke-job
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - -c
  - |
    BUILD_ID_SHORT=$$(echo "$BUILD_ID" | cut -c1-6)
    bash tools/cloud-build/monitor_kueue_job.sh \
        poc-test-infra-cluster-standard \
        us-central1 \
        "ml-a3-megagpu-onspot-$$BUILD_ID_SHORT" \
        default

# 5. Cleanup the built image from Registry to save costs
- id: cleanup-image
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - -c
  - |
    gcloud artifacts docker images delete us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID --quiet
  secretEnv: ['GCLUSTER_GCS_PATH']
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/gcluster-develop-release-bucket/versions/latest
    env: 'GCLUSTER_GCS_PATH'
