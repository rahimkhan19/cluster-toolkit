---
tags:
- m.gke-job-template
- gke
- m.gke-cluster
- m.gke-node-pool
- m.service-account
- m.gpu-rdma-vpc
- m.kubectl-apply
- m.vpc
- m.cloud-storage-bucket
- m.gke-persistent-volume

substitutions:
  _TEST_PREFIX: "" # Default to no prefix

timeout: 86400s  # 24hr
steps:
# 1. Build and push workspace container containing the current code layer
- id: build-workspace-image
  name: gcr.io/cloud-builders/docker
  entrypoint: /bin/bash
  args:
  - -c
  - |
    docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID -f- . <<EOF
    FROM us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:latest
    COPY . /workspace
    WORKDIR /workspace
    EOF
    docker push us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID

# 2. Retrieve GCS Bucket name from Secret Manager and generate Job YAML
- id: generate-job-manifest
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  secretEnv: ['GCLUSTER_GCS_PATH', 'CHS_REPO']
  args:
  - -c
  - |
    BUILD_ID_SHORT=$$(echo "$BUILD_ID" | cut -c1-6)
    
    # Determine the priority class based on the test prefix.
    if [ "${_TEST_PREFIX}" == "hotfix-" ]; then
      PRIORITY_LINE="priorityClassName: emergency-hotfix-priority"
    else
      PRIORITY_LINE=""
    fi
    
    OPTIONS_BUCKET="hpc-ctk1357"

    cat <<EOF > job.yaml
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: gke-a4-onspot-$$BUILD_ID_SHORT
      namespace: default
      labels:
        kueue.x-k8s.io/queue-name: local-queue-test-locks
        build-id: "$BUILD_ID"
    spec:
      suspend: true # Required for Kueue: the job must be created in suspended state for Kueue to manage it
      backoffLimit: 0
      template:
        spec:
          $$PRIORITY_LINE
          terminationGracePeriodSeconds: 1800 # Grants 30 minutes for terraform destroy to finish gracefully if cancelled
          serviceAccountName: test-kueue-cluster-runner-ksa
          restartPolicy: Never
          containers:
          - name: runner
            image: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID
            env:
            - name: ANSIBLE_HOST_KEY_CHECKING
              value: "false"
            - name: ANSIBLE_CONFIG
              value: "/workspace/tools/cloud-build/ansible.cfg"
            - name: BUILD_ID
              value: "$BUILD_ID"
            - name: _TEST_PREFIX
              value: "${_TEST_PREFIX}"
            - name: PROJECT_ID
              value: "$PROJECT_ID"
            - name: NUM_NODES
              value: "4"
            - name: MACHINE_TYPE
              value: "a4-highgpu-8g"
            - name: INSTANCE_PREFIX
              value: "a4spgke"
            - name: OPTIONS_GCS_PATH
              value: "gs://$$OPTIONS_BUCKET/a4hoptions.txt"
            - name: ENABLE_SPOT_FALLBACK
              value: "true"
            - name: GCLUSTER_GCS_PATH
              value: "$$GCLUSTER_GCS_PATH"
            - name: CHS_REPO
              value: "$$CHS_REPO"
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -x -e
              cd /workspace
              
              DEPLOYMENT_NAME="gke-a4-spot-$$BUILD_ID_SHORT"
              
              RUN_CLEANUP=true
              # Trap function that runs the rescue playbook (terraform destroy) 
              # if the pod is terminated by Kueue, fails, or is cancelled.
              cleanup_pod() {
                local exit_code=\$$?
                trap - EXIT SIGTERM SIGINT ERR
                set +e
                
                if [ "\$$RUN_CLEANUP" = "false" ]; then
                  exit 0
                fi
                if [ \$$exit_code -eq 0 ]; then exit_code=1; fi
                
                echo ""
                echo "=========================================================================="
                echo "CAUGHT SIGTERM OR SCRIPT ERROR!"
                echo "Halting primary Ansible execution..."
                echo "=========================================================================="
                if [ -n "\$${ANSIBLE_PID:-}" ]; then
                    kill -TERM \$$ANSIBLE_PID 2>/dev/null || true
                    wait \$$ANSIBLE_PID 2>/dev/null || true
                fi
                
                echo ""
                echo "INITIATING RESCUE PLAYBOOK: Destroying leaked infrastructure for \$$DEPLOYMENT_NAME..."
                echo "- hosts: localhost" > /workspace/cleanup-playbook.yml
                echo "  tasks:" >> /workspace/cleanup-playbook.yml
                echo "  - ansible.builtin.include_tasks:" >> /workspace/cleanup-playbook.yml
                echo "      file: tools/cloud-build/daily-tests/ansible_playbooks/tasks/rescue_gcluster_failure.yml" >> /workspace/cleanup-playbook.yml
                
                ansible-playbook /workspace/cleanup-playbook.yml -e deployment_name="\$$DEPLOYMENT_NAME" -e workspace="/workspace" || true
                
                echo "Graceful cleanup finished."
                exit \$$exit_code
              }
              trap cleanup_pod EXIT SIGTERM SIGINT

              set -e -u -o pipefail
              echo "Sourcing find_available_zone.sh to determine zone."
              source /workspace/tools/cloud-build/find_available_zone.sh
              if [ -z "\$${ZONE:-}" ]; then
                echo "ERROR: ZONE not found" >&2
                exit 1
              fi
              set -x
              cd /workspace
              bash tools/get_binary.sh "\$${_TEST_PREFIX}"
              REGION="\$${ZONE%-*}"
              EXAMPLE_BP=examples/gke-a4/gke-a4.yaml

              # adding vm to act as remote node
              echo '  - id: remote-node'                           >> \$$EXAMPLE_BP
              echo '    source: modules/compute/vm-instance'       >> \$$EXAMPLE_BP
              echo '    use: [gke-a4-net-0]'                       >> \$$EXAMPLE_BP
              echo '    settings:'                                 >> \$$EXAMPLE_BP
              echo '      machine_type: e2-standard-2'             >> \$$EXAMPLE_BP
              echo '      name_prefix: remote-node'                >> \$$EXAMPLE_BP
              echo '      add_deployment_name_before_prefix: true' >> \$$EXAMPLE_BP
              echo ''
              echo '  - id: job_template_hostname'                       >> \$$EXAMPLE_BP
              echo '    source: modules/compute/gke-job-template'        >> \$$EXAMPLE_BP
              echo '    use: [a4-pool]'                                  >> \$$EXAMPLE_BP
              echo '    settings:'                                       >> \$$EXAMPLE_BP
              echo '      image: nvidia/cuda:11.0.3-runtime-ubuntu20.04' >> \$$EXAMPLE_BP
              echo '      command:'                                      >> \$$EXAMPLE_BP
              echo '      - nvidia-smi'                                  >> \$$EXAMPLE_BP
              echo '      node_count: 1'                                 >> \$$EXAMPLE_BP
              echo '    outputs: [instructions]'                         >> \$$EXAMPLE_BP

              ENABLE_SPOT="true"
              GKE_VARS_FILE="tools/cloud-build/daily-tests/tests/gke-a4-onspot.yml"
              if [[ "\$${PROVISIONING_MODEL:-}" == "STANDARD" ]]; then
                ENABLE_SPOT="false"
                sed -i '/instance_labels:/,+1d' "\$$GKE_VARS_FILE"
                sed -i '/enable_spot: true/d' "\$$GKE_VARS_FILE"
              else
                echo "INFO: Using \$$GKE_VARS_FILE as it is for SPOT provisioning."
              fi

              # Setting placement policy as compact for nccl test to run on spot VMs, adding spot variable and removing reservation from blueprint.
              sed -i -e '/reservation_affinity:/,+3c\      placement_policy:\n        type: COMPACT\n      spot: '"\$$ENABLE_SPOT"'' \$$EXAMPLE_BP
              sed -i '/reservation/d' \$$EXAMPLE_BP
              bash tools/add_ttl_label.sh "\$$EXAMPLE_BP"

              ansible-playbook tools/cloud-build/daily-tests/ansible_playbooks/base-integration-test.yml \
                  --user=sa_112747096841303599702 \
                  --extra-vars="project=\$$PROJECT_ID build=$$BUILD_ID_SHORT chs_repo=\$$CHS_REPO" \
                  --extra-vars="region=\$$REGION zone=\$$ZONE" \
                  --extra-vars="enable_spot=\$$ENABLE_SPOT" \
                  --extra-vars="@\$$GKE_VARS_FILE" &
              ANSIBLE_PID=\$$!

              wait \$$ANSIBLE_PID
              RUN_CLEANUP=false
            resources:
              requests:
                test-locks/a4-highgpu: 1
                test-locks/gke-a4-onspot: 1
              limits:
                test-locks/a4-highgpu: 1
                test-locks/gke-a4-onspot: 1
    EOF

# 3. Submit and Monitor GKE Kueue Job with Retry
- id: submit-and-monitor-gke-job
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - -c
  - |
    gcloud container clusters get-credentials test-kueue-cluster --region=us-central1
    BUILD_ID_SHORT=$$(echo "$BUILD_ID" | cut -c1-6)
    JOB_NAME="gke-a4-onspot-$$BUILD_ID_SHORT"
    
    # Cloud Build trap: If the Cloud Build step itself receives a cancellation signal, 
    # delete the GKE job so the pod receives a SIGTERM and performs infrastructure cleanup.
    cleanup_cb() {
      echo ""
      echo "=========================================================================="
      echo "PIPELINE CANCELLED: The Cloud Build step received a termination signal."
      echo "Deleting GKE Kueue Job ($$JOB_NAME) to force the Pod to clean itself up!"
      echo "=========================================================================="
      kubectl delete job "$$JOB_NAME" -n default || true
      exit 1
    }
    trap cleanup_cb SIGTERM SIGINT
    
    MAX_RETRIES=280
    RETRY_DELAY=300
    ATTEMPT=1
    
    while true; do
      echo "=== ATTEMPT $$ATTEMPT: Submitting Kueue Job ==="
      kubectl apply -f /workspace/job.yaml
      
      set +e
      ( bash tools/cloud-build/monitor_kueue_job.sh \
          test-kueue-cluster \
          us-central1 \
          "$$JOB_NAME" \
          default | tee /workspace/job_logs.txt; exit $${PIPESTATUS[0]} ) &
      MONITOR_PID=$$!
      wait $$MONITOR_PID
      EXIT_CODE=$$?
      set -e
      
      if [ $$EXIT_CODE -eq 0 ]; then
        echo "Job succeeded!"
        break
      fi
      
      # Check if the failure was specifically due to a lack of GCP zone capacity.
      # If so, retry. If it's a real error (like a terraform syntax error), fail immediately.
      if grep -q "Couldn't find a zone to deploy\|ERROR: ZONE not found\|ZONE_RESOURCE_POOL_EXHAUSTED\|does not have enough resources available" /workspace/job_logs.txt; then
        echo "WARNING: GCP is out of zone capacity. Kueue Job has already been deleted. Retrying in $$RETRY_DELAY seconds..."
      else
        echo "ERROR: Test failed due to an actual error (not zone capacity). Failing pipeline." >&2
        exit 1
      fi
      
      if [ $$ATTEMPT -ge $$MAX_RETRIES ]; then
        echo "ERROR: Job failed to find zone capacity after $$MAX_RETRIES attempts." >&2
        exit 1
      fi
      
      sleep $$RETRY_DELAY
      ATTEMPT=$$((ATTEMPT + 1))
    done

# 4. Cleanup the built image from Registry to save costs
- id: cleanup-image
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - -c
  - |
    gcloud artifacts docker images delete us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID --quiet
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/gcluster-develop-release-bucket/versions/latest
    env: 'GCLUSTER_GCS_PATH'
  - versionName: projects/${PROJECT_ID}/secrets/cluster-health-scanner/versions/latest
    env: 'CHS_REPO'