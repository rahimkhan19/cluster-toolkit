runtime: python311
service: infra-updater
instance_class: F2

entrypoint: python3 server.py

env_variables:
  GOOGLE_CLOUD_PROJECT: "hpc-toolkit-dev"
  FIRESTORE_DATABASE_ID: "automated-dependency-management-db"
  UPDATER_DB_PROVIDER: "firestore"
  UPDATER_WORKSPACE_DIR: "/tmp/target_repo"

handlers:
- url: /.*
  script: auto
  secure: always
