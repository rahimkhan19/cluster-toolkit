runtime: python311
service: infra-updater
instance_class: F2

# The server runs a background poller (PR sync + Cloud Build status), so it
# needs exactly one always-on instance.
automatic_scaling:
  min_instances: 1
  max_instances: 1

entrypoint: python3 server.py

env_variables:
  # Project, database and repository settings come from config.yaml.
  UPDATER_WORKSPACE_DIR: "/tmp/target_repo"

handlers:
- url: /.*
  script: auto
  secure: always
